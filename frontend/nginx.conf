server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # React Router uses client-side routing — any path that isn't a real
    # file (e.g. /alerts/abc-123) must fall back to index.html so the SPA
    # can handle the route itself, instead of nginx returning a 404.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
